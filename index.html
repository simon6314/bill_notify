<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帳單管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261103_1010">
</head>
<body>
  <header class="header">
    <div>
      <h1>🧾 帳單管理</h1>
      <div class="header-sub">信用卡・定期繳費</div>
    </div>
    <div class="month-row">
      <button id="prevMonth" aria-label="上個月">‹</button>
      <input type="month" id="monthSel" aria-label="月份">
      <button id="nextMonth" aria-label="下個月">›</button>
    </div>
  </header>

  <main>
    <div id="status" class="status">載入中…</div>

    <section class="summary" id="summary"></section>

    <section>
      <h2>本月帳單</h2>
      <div id="billList" class="bill-list"></div>
    </section>

    <section>
      <details id="manage">
        <summary>管理帳單（新增／編輯／刪除）</summary>
        <form id="billForm" class="bill-form">
          <input type="hidden" id="f-id">
          <label>名稱 <input id="f-name" required placeholder="例：國泰信用卡、房貸、水費"></label>
          <label>類型
            <select id="f-type">
              <option value="信用卡">信用卡</option>
              <option value="定期">定期繳費</option>
            </select>
          </label>
          <label>結帳日（每月幾號） <input id="f-close" type="number" min="1" max="31"></label>
          <label>繳款日（每月幾號） <input id="f-due" type="number" min="1" max="31"></label>
          <label>扣款帳戶 <input id="f-account" placeholder="例：玉山活存"></label>
          <label>金額 <input id="f-default" type="number" min="0" inputmode="numeric"></label>
          <label class="check"><input id="f-auto" type="checkbox"> 自動扣繳</label>
          <label>備註 <input id="f-note"></label>
          <div class="form-btns">
            <button type="submit" class="primary">儲存</button>
            <button type="button" id="cancelEdit">取消編輯</button>
          </div>
        </form>
        <div id="manageList" class="manage-list"></div>
      </details>
    </section>
  </main>

  <script src="app.js?v=20261103_1015"></script>
</body>
</html>
